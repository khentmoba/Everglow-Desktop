<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everglow Desktop</title>
  <style>
    :root { color-scheme:dark; font:14px/1.5 'Segoe UI',system-ui,sans-serif; background:#101011; color:#f5f5f7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px; }
    main { width:100%; max-width:380px; }
    img { width:40px; height:40px; margin-bottom:20px; }
    h1 { margin:0 0 12px; font-size:24px; line-height:1.25; font-weight:600; letter-spacing:-.02em; }
    p { color:#b2b2b8; margin:0; min-height:44px; }
    .actions { display:flex; gap:12px; margin-top:28px; }
    button { min-height:36px; padding:7px 16px; border:0; border-radius:6px; background:#f5f5f7; color:#101011; font:600 14px 'Segoe UI',system-ui,sans-serif; cursor:pointer; }
    button:hover { background:#dedee3; }
    button.secondary { background:#28282e; color:#f5f5f7; }
    button.secondary:hover { background:#38383e; }
    button:focus-visible { outline:2px solid #dedee3; outline-offset:3px; }
    button:disabled { opacity:.5; cursor:default; }
    [hidden] { display:none; }
    ::selection { background:#dedee3; color:#101011; }
  </style>
  <script src="startup.js" defer></script>
</head>
<body>
  <main aria-busy="true">
    <h1 id="heading">Opening Everglow…</h1>
    <p id="message" role="status" aria-live="polite">Preparing your protected window…</p>
    <div class="actions" hidden>
      <button id="retry">Retry</button>
      <button id="close" class="secondary">Close Everglow</button>
    </div>
  </main>
</body>
</html>
