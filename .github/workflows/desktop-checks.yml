name: Desktop checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: node --test scripts/release-contract.test.mjs
      - name: Build isolated Windows installer
        run: npm run build -- --config scripts/installer-test.json
      - name: Test fresh install, upgrade, repair and downgrade protection
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one test installer' }
          ./scripts/test-installer.ps1 -Installer $installer[0].FullName
