# Builds and publishes the signed Windows installer plus the signed
# auto-update feed (`latest.json`) whenever a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The desktop app checks
# https://github.com/khentmoba/Everglow-Desktop/releases/latest/download/latest.json
# on startup and offers to install matching signed releases.
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (minisign private key,
# no password). The public key is baked into src-tauri/tauri.conf.json.

name: Desktop release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check version and release tag
        run: node --test scripts/release-contract.test.mjs

      - name: Check Discord notification
        shell: pwsh
        run: ./scripts/notify-discord.test.ps1

      - name: Check desktop update boundaries
        working-directory: src-tauri
        run: cargo test

      - name: Build signed draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Everglow Desktop ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - name: Add stable installer link and publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $stableInstaller = Join-Path $env:RUNNER_TEMP 'Everglow-Desktop-Setup.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination $stableInstaller
          gh release upload $env:GITHUB_REF_NAME $stableInstaller --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Stable installer upload failed' }
          $assets = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets' }
          foreach ($required in @('latest.json', 'Everglow-Desktop-Setup.exe')) {
            if ($required -notin $assets.assets.name) { throw "Missing release asset: $required" }
          }
          # GitHub normalizes spaces in uploaded asset names; match the suffix.
          if (-not ($assets.assets.name | Where-Object { $_ -like '*_x64-setup.exe.sig' })) {
            throw 'Missing Windows updater signature'
          }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Notify Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'Everglow-Desktop-Setup.exe'
          if (Test-Path $installer) {
            ./scripts/notify-discord.ps1 -InstallerPath $installer
          } else {
            ./scripts/notify-discord.ps1
          }
